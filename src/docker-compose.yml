version: '3.8'

services:
  # 🌐 Backend App
  learnito-api:
    container_name: learnito-api
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - learnito-net

  # 🗄️ PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: learnito-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - learnito-net

volumes:
  pgdata:

networks:
  learnito-net:
    driver: bridge
