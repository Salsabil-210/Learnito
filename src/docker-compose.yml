version: '3.8'

services:
  #  Backend App
  learnito-api:
    container_name: learnito-api
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - learnito-net

  #  PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: learnito-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - learnito-net

  #  Redis Cache
  redis:
    image: redis:7-alpine
    container_name: learnito-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - learnito-net
    command: redis-server --appendonly yes

volumes:
  pgdata:
  redis-data:

networks:
  learnito-net:
    driver: bridge
